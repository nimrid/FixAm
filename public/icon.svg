<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Nigerian Obsidian Emerald Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021a12"/>
      <stop offset="50%" stop-color="#044230"/>
      <stop offset="100%" stop-color="#01130c"/>
    </linearGradient>

    <!-- Glowing Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.6"/>
    </linearGradient>

    <!-- F-Monogram Primary Fill (Pristine White with Soft Mint Gradient) -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f2fcf6"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>

    <!-- Emerald Reticle Accent -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Radiant Solar Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <radialGradient id="sparkHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="centerGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
    </radialGradient>
  </defs>

  <!-- Container Squircle with Precision Rim -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="116" fill="url(#centerGlow)"/>
  <rect x="5" y="5" width="502" height="502" rx="111" fill="none" stroke="url(#rimGrad)" stroke-width="3"/>

  <!-- Optical Viewfinder Brackets ("Snap it" Computer Vision HUD) -->
  <g stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
    <path d="M 84 146 V 108 C 84 95 95 84 108 84 H 146" />
    <path d="M 366 84 H 404 C 417 84 428 95 428 108 V 146" />
    <path d="M 84 366 V 404 C 84 417 95 428 108 428 H 146" />
    <path d="M 366 428 H 404 C 417 428 428 417 428 404 V 366" />
  </g>

  <!-- Reticle Axis Micro-Ticks -->
  <line x1="256" y1="72" x2="256" y2="86" stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
  <line x1="256" y1="426" x2="256" y2="440" stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
  <line x1="72" y1="256" x2="86" y2="256" stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
  <line x1="426" y1="256" x2="440" y2="256" stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.65"/>

  <!-- ICONIC "F" MONOGRAM (Single Continuous Monolith Geometry) -->
  <path d="
    M 152 136
    C 152 122 164 112 178 112
    H 352
    C 364 112 372 122 368 134
    L 356 170
    C 354 176 348 180 342 180
    H 214
    V 230
    H 300
    C 310 230 318 238 316 248
    L 310 278
    C 308 284 302 288 296 288
    H 214
    V 374
    C 214 388 202 398 188 398
    H 178
    C 164 398 152 388 152 374
    Z
  " fill="url(#whiteGrad)"/>

  <!-- High-Precision Emerald Accent Core Line -->
  <rect x="174" y="148" width="16" height="216" rx="8" fill="url(#emeraldGrad)" opacity="0.85"/>

  <!-- AI Spark Aura & Golden Diamond Star ("Muse Spark 1.3") -->
  <circle cx="356" cy="302" r="56" fill="url(#sparkHalo)"/>
  <g transform="translate(356, 302)">
    <!-- 4-point Dynamic Curvature Star Spark -->
    <path d="
      M 0 -48
      Q 0 -9 42 0
      Q 0 9 0 48
      Q 0 9 -42 0
      Q 0 -9 0 -48
      Z
    " fill="url(#sparkGrad)"/>
    <!-- Central Brilliant Core -->
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
  </g>
</svg>
